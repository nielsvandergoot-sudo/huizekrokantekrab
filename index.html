<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Huize Krokante Krab</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Huize Krokante Krab">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="app-title">Huize Krokante Krab</h1>
    </header>
    
    <main>
        <!-- HET HOMESCHERM -->
        <section id="view-home" class="view active">
            <h2>Welkom!</h2>
            <p>Kies een optie in het menu.</p>
            
            <div class="menu-grid">
                <!-- Navigatie knop naar Programma -->
                <button class="menu-btn" onclick="openScherm('programma')">
                    <span class="icon">📅</span> 
                    Programma
                </button>
                
                <!-- Alvast wat placeholders voor latere features -->
                <button class="menu-btn disabled">
                    <span class="icon">🍺</span> 
                    Anylijst
                </button>
                <button class="menu-btn disabled">
                    <span class="icon">🎲</span> 
                    Spellen
                </button>
            </div>
        </section>

        <!-- HET PROGRAMMA SCHERM -->
        <section id="view-programma" class="view">
            <!-- Terugknop naar Home -->
            <button class="terug-btn" onclick="openScherm('home')">⬅ Terug naar menu</button>
            
            <div id="schema-container">
                <!-- Schema wordt hier door JavaScript ingeladen -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
