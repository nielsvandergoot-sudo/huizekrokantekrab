<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Huize Krokante Krab</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="app-title">Laden...</h1>
    </header>
    
    <main>
        <!-- HET INLOGSCHERM -->
        <section id="view-login" class="view active">
            <div class="login-box">
                <h2>Welkom Huisgenoot</h2>
                <p>Log in om verder te gaan</p>
                <input type="email" id="login-email" placeholder="naam@krokantekrab.nl">
                <input type="password" id="login-password" placeholder="Wachtwoord">
                <button onclick="login()" class="actie-btn log-btn">Log In</button>
                <p id="login-error" class="error-msg"></p>
            </div>
        </section>

        <!-- HET HOMESCHERM -->
        <section id="view-home" class="view">
            <div class="menu-grid">
                <button class="menu-btn" onclick="openScherm('anytimers')">
                    <span class="icon">⏱️</span> Anytimers
                </button>

                <button id="btn-weekend" class="menu-btn" onclick="openScherm('programma')">
                    <span class="icon">🏕️</span> Huisweekend
                    <span id="weekend-status" class="status-badge">Checkt datum...</span>
                </button>
                
                <button class="menu-btn logout" onclick="uitloggen()">
                    <span class="icon">🚪</span> Uitloggen
                </button>
            </div>
        </section>

        <!-- HET PROGRAMMA SCHERM -->
        <section id="view-programma" class="view">
            <button class="terug-btn" onclick="openScherm('home')">⬅ Terug</button>
            <div id="schema-container"></div>
        </section>

        <!-- HET ANYTIMER SCHERM -->
        <section id="view-anytimers" class="view">
            <button class="terug-btn" onclick="openScherm('home')">⬅ Terug</button>
            
            <div class="actie-balk">
                <button class="actie-btn" onclick="nieuwVerzoek()">+ Verdien Anytimers</button>
            </div>

            <div id="anytimer-container">
                <!-- Wordt gevuld door JavaScript -->
            </div>
        </section>

        <!-- ANYTIMER POP-UP (MODAL) -->
        <div id="anytimer-modal" class="modal">
            <div class="modal-content">
                <h3>Verdien Anytimers</h3>
                
                <label>Van (Wie heeft ze verdiend?):</label>
                <select id="select-van"></select>
                
                <label>Voor (Op wie?):</label>
                <select id="select-voor"></select>

                <label>Aantal:</label>
                <input type="number" id="input-aantal" value="1" min="1" max="100">
                
                <div class="modal-acties">
                    <button onclick="sluitModal()" class="btn-sm btn-outline">Annuleer</button>
                    <button onclick="opslaanNieuwVerzoek()" class="btn-sm btn-groen">Voeg Toe</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth & Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
